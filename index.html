<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bibliografía y datos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F4F6F7;
    --space: #12081F;
    --banner: #264653;
    --teal: #006D77;
    --accent: #E76F51;
    --accent-dark: #d65f41;
    --ink: #1d2b33;
    --muted: #5d6c75;
    --line: #dde4e8;
    --docblue: #2B579A;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    font-family: "Fira Sans", "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif;
    background: var(--bg);
    color: var(--ink);
  }
 
  /* Cabecera espacial */
  .top {
    position: relative; overflow: hidden;
    padding: 56px 24px 64px;
    background:
      radial-gradient(700px 300px at 85% 0%, #2a1650 0%, transparent 65%),
      radial-gradient(600px 260px at 0% 100%, #0b3a44 0%, transparent 65%),
      var(--space);
    color: #fff;
  }
  .top::before {
    content: ""; position: absolute; inset: 0; pointer-events: none; opacity: .85;
    background-image:
      radial-gradient(1.2px 1.2px at 5% 25%, #fff, transparent),
      radial-gradient(1.8px 1.8px at 12% 70%, #fff, transparent),
      radial-gradient(1px 1px at 22% 40%, #fff, transparent),
      radial-gradient(1.6px 1.6px at 33% 80%, #fff, transparent),
      radial-gradient(2px 2px at 44% 22%, #fff, transparent),
      radial-gradient(1.2px 1.2px at 55% 62%, #fff, transparent),
      radial-gradient(1.8px 1.8px at 66% 30%, #dcd0ff, transparent),
      radial-gradient(1.4px 1.4px at 76% 74%, #fff, transparent),
      radial-gradient(1.6px 1.6px at 88% 38%, #dcd0ff, transparent),
      radial-gradient(1.2px 1.2px at 95% 78%, #fff, transparent);
  }
  .top-inner { position: relative; max-width: 680px; margin: 0 auto; }
 
  .logos { display: flex; gap: 12px; margin-bottom: 22px; }
  .logo {
    height: 54px; width: auto; padding: 5px;
    background: rgba(255, 255, 255, .10); border-radius: 14px;
  }
  .logo[hidden] { display: none; }
 
  .eyebrow {
    margin: 0 0 8px; font-size: .78rem; font-weight: 700;
    letter-spacing: .14em; text-transform: uppercase; color: var(--accent);
  }
  h1 {
    margin: 0; font-size: clamp(1.7rem, 6vw, 2.4rem); line-height: 1.15; font-weight: 700;
  }
 
  /* Contenido */
  main { max-width: 680px; margin: -28px auto 0; padding: 0 24px 48px; position: relative; }
 
  .row {
    display: flex; align-items: center; gap: 16px;
    padding: 18px 20px;
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 18px;
    box-shadow: 0 14px 34px rgba(18, 8, 31, .12);
  }
  .doc {
    flex: none; width: 52px; height: 52px; border-radius: 14px;
    background: var(--docblue); color: #fff;
    display: grid; place-items: center;
    font-weight: 700; font-size: 1.35rem;
  }
  .info { flex: 1; min-width: 0; }
  .info strong { display: block; font-size: 1.08rem; }
  .info span { font-size: .9rem; color: var(--muted); }
 
  .btn {
    flex: none; display: inline-flex; align-items: center; gap: 10px;
    padding: 13px 24px; border-radius: 999px;
    background: var(--accent); color: #fff; text-decoration: none;
    font-weight: 700; font-size: 1rem;
    box-shadow: 0 8px 20px rgba(231, 111, 81, .3);
    transition: background .15s ease, transform .15s ease, box-shadow .15s ease;
  }
  .btn:hover { background: var(--accent-dark); transform: translateY(-1px); box-shadow: 0 10px 24px rgba(231, 111, 81, .4); }
  .btn:active { transform: translateY(0); }
  .btn:focus-visible { outline: 3px solid var(--space); outline-offset: 3px; }
  .btn svg { width: 20px; height: 20px; }
 
  @media (max-width: 520px) {
    .top { padding: 40px 20px 56px; }
    main { padding: 0 20px 40px; }
    .row { flex-wrap: wrap; }
    .info { flex: 1 1 calc(100% - 70px); }
    .btn { width: 100%; justify-content: center; }
  }
</style>
</head>
<body>
 
<header class="top">
  <div class="top-inner">
    <!-- Opcional: logos junto a este archivo. Si no existen, se ocultan solos. -->
    <div class="logos">
      <img class="logo" src="escudo-color-UACH.png" alt="Escudo UACH" onerror="this.hidden=true">
      <img class="logo" src="uachIngenieriaLogo.png" alt="Facultad de Ingeniería UACH" onerror="this.hidden=true">
    </div>
    <p class="eyebrow">Material de apoyo</p>
    <h1>Bibliografía y datos utilizados</h1>
  </div>
</header>
 
<main>
  <div class="row">
    <div class="doc" aria-hidden="true">W</div>
    <div class="info">
      <strong>Se descargará el documento de Word</strong>
      <span>Bibliografía y datos · .docx</span>
    </div>
    <!-- Cambia el nombre por el de tu Word (misma carpeta que este archivo) -->
    <a class="btn" href="assets/Propuesta_para_guerra_espacial.docx" download="Bibliografia_y_datos.docx">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M12 3v12"/><path d="m7 11 5 5 5-5"/><path d="M5 21h14"/>
      </svg>
      Descargar
    </a>
  </div>
</main>
 
</body>
</html>
